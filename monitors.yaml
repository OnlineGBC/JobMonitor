# monitors.yaml — LinkedIn jobs: Remote USA + Hybrid NYC + Hybrid RDU + Chief AI Officer
#
# Only the following fields are read by monitor.py:
#   - name       (identifier)
#   - url        (LinkedIn search URL)
#   - headless   (browser mode; defaults to False if omitted)
#
# Legacy fields (wait_selector, css_selector, structured_mode, compare_mode,
# remove_selectors, ignore_regexes, normalize_whitespace, skip_if_page_text_matches,
# render_js, wait_until, timeout_seconds, headers) were previously here but are
# ignored — LinkedIn selectors and filtering logic are hardcoded in monitor.py.

monitors:
- name: "RemoteUSA"
  url: "director (title:\"VP\" OR title:\"Vice President\" OR title:\"Director\" OR
    title:\"CAIO\" OR title:\"Vice-President\" OR title:\"Head\" OR title:\"Leader\"\
    \ OR title:\"Fractional CTO\" OR title:\"Fractional CIO\" ) AND (title:\"AI\"\
    \ OR title:\"Artificial Intelligence\") AND NOT (\"Crossover\" OR \"Get IT\" OR
    \"Ethos\" OR \"Talentify\" OR \"DataAnnotation\" OR \"Ladders\" OR \"Toptal\"\
    \ OR \"Stealth Stanford AI Startup\" OR \"Lensa\" OR \"Tempus\" OR \"Harnham\"\
    \ OR \"hackajob\" OR \"Swooped\" OR \"Jobgether\") in consulting contract or full-time
    or part-time remote Easy Apply under 10 applicants posted in the past 24 hours"
  headless: true

  enabled: true
  to_addrs: raja@onlinegbc.com
  owner: raja@onlinegbc.com
  # Promoted ads bypass LinkedIn's own NOT filter, so block them client-side.
  exclude:
  - DataAnnotation
- name: "HybridNYC"
  url: "https://www.linkedin.com/jobs/search/?currentJobId=4442292124&f_E=5%2C6&f_EA=true&f_TPR=r86400&geoId=105080838&keywords=(title%3A%22Director%22%20OR%20title%3A%22VP%22%20OR%20title%3A%22Vice%20President%22%20OR%20title%3A%22Vice-President%22%20OR%20title%3A%22Head%22%20OR%20title%3A%22Leader%22%20OR%20title%3A%22Fractional%20CIO%22%20OR%20title%3A%22Fractional%20CTO%22%20)%20AND%20(title%3A%22AI%22%20OR%20title%3A%22Artificial%20Intelligence%22)%20AND%20NOT%20(%22Crossover%22%20OR%20%22Get%20IT%22%20OR%20%22Talentify%22%20OR%20%22Toptal%22%20OR%20%22Stealth%20Stanford%20AI%20Startup%22%20OR%20%22Lensa%22%20OR%20%22Harnham%22%20OR%20%22Swooped%22%20%20OR%20%22Jobgether%22%20OR%20%22Ladders%22)&origin=JOB_SEARCH_PAGE_SEARCH_BUTTON&refresh=true&sortBy=R"
  headless: true

  enabled: false
  to_addrs: raja@onlinegbc.com
  owner: raja@onlinegbc.com
- name: "Chief AI Officer"
  url: "https://www.linkedin.com/jobs/search/?currentJobId=4440012633&f_EA=true&f_TPR=r86400&geoId=103644278&keywords=%22chief%20AI%20officer%22&origin=JOB_SEARCH_PAGE_JOB_FILTER&refresh=true&sortBy=R"
  headless: true
